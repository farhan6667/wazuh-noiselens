[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-noiselens"
version = "0.3.0"
description = "Offline Wazuh alert concentration and suppression impact analysis"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Syed Farhan Ahmed"}]
dependencies = []
readme = "README.md"

[project.urls]
Homepage = "https://github.com/farhan6667/wazuh-noiselens"
Sponsor = "https://github.com/farhan6667/farhan6667/blob/main/SPONSOR.md"

[project.scripts]
noiselens = "noiselens.cli:main"

[tool.setuptools.packages.find]
include = ["noiselens*"]

[tool.setuptools.package-data]
noiselens = ["policy.schema.json"]
