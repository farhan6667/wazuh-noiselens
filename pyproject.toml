[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-noiselens"
version = "0.1.0"
description = "Offline Wazuh alert concentration and suppression impact analysis"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Syed Farhan Ahmed"}]
dependencies = []
readme = "README.md"

[project.scripts]
noiselens = "noiselens.cli:main"

[tool.setuptools.packages.find]
include = ["noiselens*"]
