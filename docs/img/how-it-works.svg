<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 404" width="1280" height="404" role="img" aria-label="How Wazuh NoiseLens works in four steps"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a16"/><stop offset="1" stop-color="#0d1a36"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff3b6b"/></linearGradient>
<linearGradient id="acx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff3b6b"/></linearGradient>
<radialGradient id="gl1" cx="0.78" cy="0.35" r="0.55"><stop offset="0" stop-color="#ff9f1c" stop-opacity="0.28"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#ff3b6b" stop-opacity="0.18"/><stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
<path d="M28 0 L56 16 V48 L28 64 L0 48 V16 Z M28 64 V97 M0 48 L-28 64 M56 48 L84 64" fill="none" stroke="#ff9f1c" stroke-opacity="0.09" stroke-width="1.2"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="wclip"><rect width="1280" height="404"/></clipPath>
</defs><g clip-path="url(#wclip)"><rect width="1280" height="404" fill="url(#bg)"/><rect width="1280" height="404" fill="url(#hex)"/><rect width="1280" height="404" fill="url(#gl1)"/><rect width="1280" height="404" fill="url(#gl2)"/><g transform="translate(1180 6) scale(0.4)">
<path d="M50 4 L92 20 V58 C92 88 72 108 50 116 C28 108 8 88 8 58 V20 Z" fill="none" fill-opacity="0.1" stroke="url(#ac)" stroke-width="4" stroke-linejoin="round"/>
<polyline points="20,64 38,64 46,42 57,88 65,64 82,64" fill="none" stroke="#ff3b6b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ff9f1c" letter-spacing="3.2">HOW IT WORKS</text><rect x="40" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#ff9f1c" stroke-opacity="0.5"/><rect x="40" y="76" width="266" height="192" rx="18" fill="#ff9f1c" fill-opacity="0.08"/><circle cx="76" cy="114" r="20" fill="#ff9f1c" fill-opacity="0.16" stroke="#ff9f1c" stroke-opacity="0.7"/><text x="76" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><g transform="translate(254 98)" fill="none" stroke="#ff9f1c" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h20M5 15h20M5 23h12"/></g><text x="62" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Exported alerts</text><text x="62" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >alerts.json from your manager,</text><text x="62" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >one alert per line</text><text x="62" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >(JSON Lines)</text><path d="M314 172 H338" stroke="#ff9f1c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M332 165 L343 172 L332 179" fill="none" stroke="#ff9f1c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#ff9f1c" stroke-opacity="0.5"/><rect x="352" y="76" width="266" height="192" rx="18" fill="#ff9f1c" fill-opacity="0.08"/><circle cx="388" cy="114" r="20" fill="#ff9f1c" fill-opacity="0.16" stroke="#ff9f1c" stroke-opacity="0.7"/><text x="388" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><g transform="translate(566 98)" fill="none" stroke="#ff9f1c" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h20M5 15h20M5 22h20"/><circle cx="11" cy="8" r="2.8" fill="#0a1226"/><circle cx="19" cy="15" r="2.8" fill="#0a1226"/><circle cx="9" cy="22" r="2.8" fill="#0a1226"/></g><text x="374" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Proposed policy</text><text x="374" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >The exception you are weighing,</text><text x="374" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >plus the protected level and</text><text x="374" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >rule IDs</text><path d="M626 172 H650" stroke="#ff9f1c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M644 165 L655 172 L644 179" fill="none" stroke="#ff9f1c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#ff9f1c" stroke-opacity="0.5"/><rect x="664" y="76" width="266" height="192" rx="18" fill="#ff9f1c" fill-opacity="0.08"/><circle cx="700" cy="114" r="20" fill="#ff9f1c" fill-opacity="0.16" stroke="#ff9f1c" stroke-opacity="0.7"/><text x="700" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><g transform="translate(878 98)" fill="none" stroke="#ff9f1c" stroke-width="2.6" stroke-linecap="round"><circle cx="13" cy="13" r="9"/><path d="M20 20l7 7"/></g><text x="686" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >NoiseLens</text><text x="686" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Runs offline on your machine.</text><text x="686" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Counts matches by rule and</text><text x="686" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >checks protected alerts</text><path d="M938 172 H962" stroke="#ff9f1c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M956 165 L967 172 L956 179" fill="none" stroke="#ff9f1c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="976" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#ff3b6b" stroke-opacity="0.5"/><rect x="976" y="76" width="266" height="192" rx="18" fill="#ff3b6b" fill-opacity="0.12"/><circle cx="1012" cy="114" r="20" fill="#ff3b6b" fill-opacity="0.16" stroke="#ff3b6b" stroke-opacity="0.7"/><text x="1012" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><g transform="translate(1190 98)" fill="none" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="24" height="24" rx="3"/><path d="M8 20v-5M14 20V9M20 20v-8"/></g><text x="998" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Impact report</text><text x="998" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Matched, remaining and protected</text><text x="998" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >counts in JSON and offline</text><text x="998" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >HTML. Exit 1 on a hit</text><rect x="40" y="302" width="1200" height="74" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ff9f1c" stroke-opacity="0.3"/><text x="66" y="334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="700" fill="#ffffff" >The protected-alert guard sets the exit code</text><text x="66" y="359" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >No protected alert matched: exit 0. One matched: exit 1, and someone reviews it first.</text><rect x="920" y="320" width="140" height="38" rx="10" fill="#1fbf8f" fill-opacity="0.2"/><text x="990" y="345" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="15" font-weight="600" fill="#7ee3bf" text-anchor="middle">exit 0  clean</text><rect x="1074" y="320" width="152" height="38" rx="10" fill="#ff3b6b" fill-opacity="0.2"/><text x="1150" y="345" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="15" font-weight="600" fill="#ffb3c1" text-anchor="middle">exit 1  review</text></g></svg>