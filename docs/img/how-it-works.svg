<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-label="How Wazuh NoiseLens works">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1b"/><stop offset="1" stop-color="#101c38"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a00"/><stop offset="1" stop-color="#ff2e6d"/></linearGradient>
<radialGradient id="gl" cx="0.85" cy="0.15" r="0.7"><stop offset="0" stop-color="#ff8a00" stop-opacity="0.22"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
</defs><rect width="1280" height="350" rx="18" fill="url(#bg)"/>
<text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ff8a00" letter-spacing="3">HOW IT WORKS</text>
<rect x="40" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#ff8a00" stroke-opacity="0.6"/><rect x="40" y="78" width="250" height="128" rx="16" fill="#ff8a00" fill-opacity="0.07"/><text x="60" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >1. Exported alerts</text><text x="60" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >alerts.json from your manager,</text><text x="60" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >one alert per line</text><text x="60" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >(JSON Lines)</text><rect x="352" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#ff8a00" stroke-opacity="0.6"/><rect x="352" y="78" width="250" height="128" rx="16" fill="#ff8a00" fill-opacity="0.07"/><text x="372" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >2. Proposed policy</text><text x="372" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >The exception you are thinking</text><text x="372" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >about, plus the protected</text><text x="372" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >level and rule IDs</text><rect x="664" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#ff8a00" stroke-opacity="0.6"/><rect x="664" y="78" width="250" height="128" rx="16" fill="#ff8a00" fill-opacity="0.07"/><text x="684" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >3. NoiseLens</text><text x="684" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Runs offline on your machine.</text><text x="684" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Counts matches by rule and</text><text x="684" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >checks protected alerts</text><rect x="976" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#ff2e6d" stroke-opacity="0.6"/><rect x="976" y="78" width="250" height="128" rx="16" fill="#ff2e6d" fill-opacity="0.07"/><text x="996" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >4. Impact report</text><text x="996" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Matched, remaining and</text><text x="996" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >protected counts in JSON</text><text x="996" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >and offline HTML</text><path d="M298 142 H336" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round"/><path d="M330 135 L341 142 L330 149" fill="none" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 142 H648" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round"/><path d="M642 135 L653 142 L642 149" fill="none" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M922 142 H960" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round"/><path d="M954 135 L965 142 L954 149" fill="none" stroke="#ff8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="252" width="1200" height="70" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#4a3563"/><text x="66" y="283" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" >The guard decides the exit code</text><text x="66" y="305" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#aab9df" >No protected alert matched: exit 0. One matched: exit 1 and a review is needed.</text><rect x="900" y="268" width="150" height="38" rx="10" fill="#1fbf8f" fill-opacity="0.18"/><text x="975" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7ee3bf" text-anchor="middle">exit 0  clean</text><rect x="1066" y="268" width="158" height="38" rx="10" fill="#ff4d6d" fill-opacity="0.18"/><text x="1145" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffb3c1" text-anchor="middle">exit 1  review</text>
</svg>